<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的学习主页</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f2f6fc;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>我的第二个 Cloudflare 版本</h1>
<img src="images/study.jpg" alt="我的学习图片" width="300">
        <p>我正在学习 Python、Excel 自动化和网页制作。</p>
        <p>
            <a href="https://github.com/" target="_blank">
                访问 GitHub
            </a>
        </p>
    </div>
</body>
</html>
